name: Auto Release Demise Client

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-release:
    name: Check Version and Release
    runs-on: ubuntu-latest

    steps:
      # checkout the repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # inspect version file and compare against existing releases
      - name: Check version.md
        id: version_check
        run: |
          # read version string and strip any trailing whitespace
          VERSION=$(cat .github/workflows/version.md | tr -d '[:space:]')
          echo "detected version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

          # query github releases via cli to check if tag exists
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "release_exists=true" >> $GITHUB_OUTPUT
            echo "version v$VERSION is already released. skipping release build."
          else
            echo "release_exists=false" >> $GITHUB_OUTPUT
            echo "new version v$VERSION detected! triggering release build."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # provision java 17 runtime only when a new release is needed
      - name: Set up JDK 17
        if: steps.version_check.outputs.release_exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ensure gradlew execution permissions
      - name: Grant execute permission for gradlew
        if: steps.version_check.outputs.release_exists == 'false' || github.event_name == 'workflow_dispatch'
        run: chmod +x gradlew

      # compile shadow fat jar with bundled dependencies and windows natives
      - name: Build shadow jar
        if: steps.version_check.outputs.release_exists == 'false' || github.event_name == 'workflow_dispatch'
        run: ./gradlew shadowJar --no-daemon

      # compute sha256 checksum for binary integrity and virustotal scans
      - name: Generate sha256 checksum
        if: steps.version_check.outputs.release_exists == 'false' || github.event_name == 'workflow_dispatch'
        id: checksum
        run: |
          cd build/libs
          JAR_FILE=$(ls demise-*.jar | head -n 1)
          SHA256=$(sha256sum "$JAR_FILE" | awk '{print $1}')
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "$SHA256 *$JAR_FILE" > checksum.sha256
          echo "computed sha256: $SHA256"

      # publish the automated github release with files and instructions
      - name: Publish new version release
        if: steps.version_check.outputs.release_exists == 'false' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: Demise Client v${{ steps.version_check.outputs.version }}
          tag_name: ${{ steps.version_check.outputs.tag }}
          files: |
            build/libs/*.jar
            build/libs/checksum.sha256
            json/demise.json
          body: |
            ### Automated Build Verification
            * **Version**: `v${{ steps.version_check.outputs.version }}`
            * **Binary**: `${{ steps.checksum.outputs.jar_file }}`
            * **SHA-256**: `${{ steps.checksum.outputs.sha256 }}`
            * **Security Verification**: Compiled cleanly from source via GitHub Actions runner.

            ---

            ### Installation Instructions
            1. Download `${{ steps.checksum.outputs.jar_file }}` and rename it to `demise.jar`.
            2. Download `demise.json`.
            3. Copy both files into your `.minecraft` directory:
               * Windows path: `%appdata%\.minecraft\versions\demise\`
               * Verify the files are named `demise.jar` and `demise.json`.
            4. In your Minecraft launcher (Vanilla, HMCL, Prism, TLauncher):
               * Select version `release demise`.
               * Ensure **Java 17** is chosen in launcher Java settings.
            5. Launch and enjoy!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
