plugins {
    id "java"
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

group = "wtf.demise"
version = "1.8.9"
sourceCompatibility = 17
targetCompatibility = 17

ext {
    gsonVersion = "2.8.9"
}

project.ext.lwjglVersion = "3.3.6"
// set lwjgl natives to windows 64-bit for dll loading
project.ext.lwjglNatives = "natives-windows"


repositories {
    mavenCentral()
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-nanovg"
    implementation "org.lwjgl:lwjgl-openal"
    implementation "org.lwjgl:lwjgl-opengl"
    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-nanovg::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
}

repositories {
    mavenCentral()
    maven {
        url "https://repo.marcloud.net/"
        name "MarCloud-Repository"
    }
    maven {
        url "https://libraries.minecraft.net/"
    }
    maven {
        url "https://mvnrepository.com/artifact"
    }
    maven {
        url 'https://oss.sonatype.org/content/repositories/snapshots/'
    }
}

// removed unused javafx block for standard java compatibility

shadowJar {
    archiveClassifier.set("all")
    configurations = [project.configurations.runtimeClasspath]
}

compileJava {
    options.encoding = "UTF-8"
    options.release = 17
}

dependencies {
    // use minecraft 1.8.9 native netty 4.0.23.final for netty channel pipeline compatibility
    implementation "io.netty:netty-all:4.0.23.Final"
    implementation "net.sf.jopt-simple:jopt-simple:4.6"

    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")

    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-nanovg"
    implementation "org.lwjgl:lwjgl-openal"
    implementation "org.lwjgl:lwjgl-opengl"
    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-nanovg::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"

    implementation "org.projectlombok:lombok:1.18.32"
    annotationProcessor "org.projectlombok:lombok:1.18.32"
    compileOnly "org.projectlombok:lombok:1.18.32"

    implementation "net.java.jinput:jinput:2.0.5"
    implementation "com.mojang:icu4j-core-mojang:51.2"
    implementation 'org.apache.httpcomponents:httpclient:4.5.13'
    implementation "org.apache.httpcomponents:httpcore:4.3.2"
    implementation "oshi:oshi-core:1.1"
    implementation "net.java.dev.jna:jna:3.4.0"
    implementation "net.java.dev.jna:platform:3.4.0"
    implementation "net.java.jutils:jutils:1.0.0"
    implementation "commons-logging:commons-logging:1.1.3"
    implementation "org.apache.commons:commons-compress:1.8.1"
    implementation "org.apache.logging.log4j:log4j-api:2.0-beta9"
    implementation "org.apache.logging.log4j:log4j-core:2.0-beta9"
    implementation "tv.twitch:twitch:6.5"
    implementation "com.google.guava:guava:17.0"
    implementation "org.apache.commons:commons-lang3:3.3.2"
    implementation "commons-io:commons-io:2.4"
    implementation "commons-codec:commons-codec:1.9"
    implementation "com.google.code.gson:gson:${gsonVersion}"
    implementation "com.paulscode.sound:libraryjavasound:20101123"
    implementation "com.paulscode.sound:codecwav:20101023"
    implementation "com.paulscode.sound:soundsystem:20120107"
    implementation "com.paulscode.sound:codecjorbis:20101023"
    implementation "com.github.javafaker:javafaker:1.0.2"

    implementation "com.mojang:authlib:1.5.21"

    implementation "it.unimi.dsi:fastutil:8.5.13"
    implementation "org.json:json:20240303"
    implementation "org.joml:joml:1.10.7"
    implementation "com.alibaba:fastjson:2.0.52"
    implementation "org.jetbrains:annotations:24.1.0"

    implementation "com.madgag:animated-gif-lib:1.4"

    implementation fileTree(dir: "libs", include: "*.jar")
    compileOnly fileTree(dir: "libs", include: "*.jar")
    testCompileOnly fileTree(dir: "libs", include: "*.jar")
}

// direct development launcher task for instant terminal execution without shadowjar packaging
tasks.register('runClient', JavaExec) {
    group = "minecraft"
    description = "runs the demise client directly from source for rapid testing"
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "Start"
    workingDir = file("${project.rootDir}/run")
    
    // allocate memory and configure jvm debugging
    jvmArgs = [
        "-Xmx2G",
        "-Xms512M",
        "-XX:+AllowEnhancedClassRedefinition"
    ]
    
    // pass minecraft 1.8.9 launch arguments targeting native assets directory and custom username
    args = [
        "--version", "demise",
        "--username", "hesophere",
        "--accessToken", "0",
        "--assetsDir", "${System.getProperty('user.home')}/AppData/Roaming/.minecraft/assets",
        "--assetIndex", "1.8",
        "--userProperties", "{}"
    ]
    
    doFirst {
        file("${project.rootDir}/run").mkdirs()
    }
}